# Tunables read by the services. An empty value keeps the default that is set in the code.
x-http: &http
  HTTP_READ_HEADER_TIMEOUT: ${HTTP_READ_HEADER_TIMEOUT:-}
  HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT:-}
  HTTP_WRITE_TIMEOUT: ${HTTP_WRITE_TIMEOUT:-}
  HTTP_IDLE_TIMEOUT: ${HTTP_IDLE_TIMEOUT:-}
  HTTP_MAX_HEADER_BYTES: ${HTTP_MAX_HEADER_BYTES:-}
  SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-}

x-db: &db
  STARTUP_TIMEOUT: ${STARTUP_TIMEOUT:-}
  DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-}
  DB_POOL_SIZE: ${DB_POOL_SIZE:-}
  STORE_TIMEOUT: ${STORE_TIMEOUT:-}

x-broker: &broker
  BROKER_HEARTBEAT: ${BROKER_HEARTBEAT:-}
  BROKER_DIAL_TIMEOUT: ${BROKER_DIAL_TIMEOUT:-}
  BROKER_RECONNECT_DELAY: ${BROKER_RECONNECT_DELAY:-}

x-mock: &mock
  EVENT_INTERVAL_CEILING: ${EVENT_INTERVAL_CEILING:-}
  MIN_SEED_RECORDS: ${MIN_SEED_RECORDS:-}
  SEED: ${SEED:-}

services:
  postgres:
    image: postgres:18.3-alpine@sha256:54451ecb8ab38c24c3ec123f2fd501303a3a1856a5c66e98cecf2460d5e1e9d7
    environment:
      POSTGRES_USER: atlas_admin
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?run make env}
      CANONICAL_DB_PASSWORD: ${CANONICAL_DB_PASSWORD:?run make env}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?run make env}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./deploy/postgres/init.sh:/docker-entrypoint-initdb.d/01-owners.sh:ro
    networks: [canonical, auth-store]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U atlas_admin -d postgres']
      interval: 3s
      timeout: 2s
      retries: 15
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.2.5-alpine@sha256:d4a3806070111cc69130a6542aa4049b612789852ef11fc3862abc94631b2572
    environment:
      RABBITMQ_DEFAULT_USER: atlas
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?run make env}
    volumes: [rabbitmq-data:/var/lib/rabbitmq]
    networks: [events]
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Each agency owns its database on a network only that agency can reach.
  bmkg-db:
    image: postgres:18.3-alpine@sha256:54451ecb8ab38c24c3ec123f2fd501303a3a1856a5c66e98cecf2460d5e1e9d7
    environment:
      POSTGRES_USER: bmkg
      POSTGRES_DB: bmkg
      POSTGRES_PASSWORD: ${BMKG_DB_PASSWORD:?run make env}
    volumes: [bmkg-data:/var/lib/postgresql]
    networks: [bmkg-store]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U bmkg -d bmkg']
      interval: 3s
      timeout: 2s
      retries: 15
    restart: unless-stopped

  bmkg:
    build: ./services/bmkg
    environment:
      DATABASE_URL: postgres://bmkg:${BMKG_DB_PASSWORD}@bmkg-db:5432/bmkg?sslmode=disable
      BMKG_API_KEY: ${BMKG_API_KEY:?run make env}
      EVENT_INTERVAL: ${SOURCE_EVENT_INTERVAL:-}
      RESPONSE_DELAY: ${BMKG_RESPONSE_DELAY:-}
      RESPONSE_DELAY_FLOOR: ${BMKG_RESPONSE_DELAY_FLOOR:-}
      RESPONSE_DELAY_CEILING: ${BMKG_RESPONSE_DELAY_CEILING:-}
      <<: [*http, *db, *mock]
    ports: ['127.0.0.1:${BMKG_PORT:-8081}:8081']
    networks: [sources, bmkg-store]
    depends_on:
      bmkg-db: {condition: service_healthy}
    restart: unless-stopped

  # The practice profile of the vendored manifest. The image is pinned and unmodified.
  sensor-pantai:
    image: sustuna/sensor-pantai@sha256:51fbd90d3891ad6e9f5768ad330ffb65205644cb29e50da65c7538f2e0b4397d
    environment:
      PANTAI_PROFILE: practice
      PANTAI_SEED: '42'
      PANTAI_SPEED: '60'
      PANTAI_AUTH_TOKEN: ${PANTAI_AUTH_TOKEN:?run make env}
    networks: [sources]
    restart: unless-stopped

  pvmbg-db:
    image: postgres:18.3-alpine@sha256:54451ecb8ab38c24c3ec123f2fd501303a3a1856a5c66e98cecf2460d5e1e9d7
    environment:
      POSTGRES_USER: pvmbg
      POSTGRES_DB: pvmbg
      POSTGRES_PASSWORD: ${PVMBG_DB_PASSWORD:?run make env}
    volumes: [pvmbg-data:/var/lib/postgresql]
    networks: [pvmbg-store]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U pvmbg -d pvmbg']
      interval: 3s
      timeout: 2s
      retries: 15
    restart: unless-stopped

  pvmbg:
    build: ./services/pvmbg
    environment:
      DATABASE_URL: postgres://pvmbg:${PVMBG_DB_PASSWORD}@pvmbg-db:5432/pvmbg?sslmode=disable
      PVMBG_TOKEN: ${PVMBG_TOKEN:?run make env}
      MIN_RESPONSE_DELAY: ${PVMBG_MIN_RESPONSE_DELAY:-}
      MAX_RESPONSE_DELAY: ${PVMBG_MAX_RESPONSE_DELAY:-}
      EVENT_INTERVAL: ${SOURCE_EVENT_INTERVAL:-}
      OUTAGE_MAX_HANG: ${OUTAGE_MAX_HANG:-}
      RESPONSE_DELAY_FLOOR: ${PVMBG_RESPONSE_DELAY_FLOOR:-}
      RESPONSE_DELAY_CEILING: ${PVMBG_RESPONSE_DELAY_CEILING:-}
      <<: [*http, *db, *mock]
    ports: ['127.0.0.1:${PVMBG_PORT:-8082}:8082']
    networks: [sources, pvmbg-store]
    depends_on:
      pvmbg-db: {condition: service_healthy}
    restart: unless-stopped

  aggregator:
    build:
      context: ./services/bnpb
      dockerfile: aggregator/Dockerfile
    environment:
      DATABASE_URL: postgres://aggregator:${CANONICAL_DB_PASSWORD}@postgres:5432/canonical?sslmode=disable
      RABBITMQ_URL: amqp://atlas:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      BMKG_BASE_URL: http://bmkg:8081
      PVMBG_BASE_URL: http://pvmbg:8082
      BMKG_API_KEY: ${BMKG_API_KEY:?run make env}
      PVMBG_TOKEN: ${PVMBG_TOKEN:?run make env}
      AGGREGATOR_INTERNAL_TOKEN: ${AGGREGATOR_INTERNAL_TOKEN:?run make env}
      AUDIT_TOKEN: ${AUDIT_TOKEN:?run make env}
      POLL_INTERVAL: ${POLL_INTERVAL:-}
      SOURCE_TIMEOUT: ${SOURCE_TIMEOUT:-}
      SOURCE_RETRIES: ${SOURCE_RETRIES:-}
      RETRY_BACKOFF: ${RETRY_BACKOFF:-}
      QUERY_TIMEOUT: ${QUERY_TIMEOUT:-}
      HAZARD_READ_CACHE_TTL: ${HAZARD_READ_CACHE_TTL:-}
      QUERY_CAPACITY: ${QUERY_CAPACITY:-}
      FIELD_TEAM_RESERVED_PERCENT: ${FIELD_TEAM_RESERVED_PERCENT:-}
      QUERY_POOL_SIZE: ${QUERY_POOL_SIZE:-}
      INGEST_POOL_SIZE: ${INGEST_POOL_SIZE:-}
      PUBLISH_TIMEOUT: ${PUBLISH_TIMEOUT:-}
      SOURCE_IDLE_CONN_TIMEOUT: ${SOURCE_IDLE_CONN_TIMEOUT:-}
      FAILURE_MARK_TIMEOUT: ${FAILURE_MARK_TIMEOUT:-}
      WARNING_LOOKBACK: ${WARNING_LOOKBACK:-}
      MAX_SOURCE_RECORDS: ${MAX_SOURCE_RECORDS:-}
      MAX_SOURCE_BYTES: ${MAX_SOURCE_BYTES:-}
      SENSOR_PANTAI_URL: http://sensor-pantai:8080
      PANTAI_AUTH_TOKEN: ${PANTAI_AUTH_TOKEN:?run make env}
      SENSOR_POLL_INTERVAL: ${SENSOR_POLL_INTERVAL:-}
      SENSOR_TIMEOUT: ${SENSOR_TIMEOUT:-}
      SENSOR_STALE_AFTER: ${SENSOR_STALE_AFTER:-}
      AUDIT_TIMEOUT: ${AUDIT_TIMEOUT:-}
      OPS_CAPACITY: ${OPS_CAPACITY:-}
      <<: [*http, *db, *broker]
      SOURCE_SCHEMA_POLICY_FILE: /etc/atlas/schema/policy.json
    configs:
      - source: source-schema-policy
        target: /etc/atlas/schema/policy.json
    networks: [sources, internal-api, canonical, events]
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    restart: unless-stopped

  auth:
    build:
      context: ./services/bnpb
      dockerfile: auth/Dockerfile
    environment:
      AUTH_DATABASE_URL: postgres://auth:${AUTH_DB_PASSWORD}@postgres:5432/auth?sslmode=disable
      AUTH_VALIDATE_TOKEN: ${AUTH_VALIDATE_TOKEN:?run make env}
      AUTH_ED25519_PRIVATE_KEY_B64: ${AUTH_ED25519_PRIVATE_KEY_B64:?run make env}
      MEDIA_CLIENT_ID: ${MEDIA_CLIENT_ID:?run make env}
      MEDIA_CLIENT_SECRET: ${MEDIA_CLIENT_SECRET:?run make env}
      FIELD_TEAM_CLIENT_ID: ${FIELD_TEAM_CLIENT_ID:?run make env}
      FIELD_TEAM_CLIENT_SECRET: ${FIELD_TEAM_CLIENT_SECRET:?run make env}
      INTERNAL_OPS_CLIENT_ID: ${INTERNAL_OPS_CLIENT_ID:?run make env}
      INTERNAL_OPS_CLIENT_SECRET: ${INTERNAL_OPS_CLIENT_SECRET:?run make env}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-}
      AUTH_MAX_BODY_BYTES: ${AUTH_MAX_BODY_BYTES:-}
      <<: [*http, *db]
    ports: ['127.0.0.1:${AUTH_PORT:-8084}:8084']
    networks: [auth-api, auth-store]
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped

  client-api:
    build:
      context: ./services/bnpb
      dockerfile: client-api/Dockerfile
    environment:
      AUTH_BASE_URL: http://auth:8084
      AGGREGATOR_BASE_URL: http://aggregator:8083
      AGGREGATOR_INTERNAL_TOKEN: ${AGGREGATOR_INTERNAL_TOKEN:?run make env}
      AUTH_VALIDATE_TOKEN: ${AUTH_VALIDATE_TOKEN:?run make env}
      AUTH_ED25519_PUBLIC_KEY_B64: ${AUTH_ED25519_PUBLIC_KEY_B64:?run make env}
      RABBITMQ_URL: amqp://atlas:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      CLIENT_API_OUTBOUND_TIMEOUT: ${CLIENT_API_OUTBOUND_TIMEOUT:-}
      CLIENT_API_REQUEST_CAPACITY: ${CLIENT_API_REQUEST_CAPACITY:-}
      FIELD_TEAM_RESERVED_PERCENT: ${FIELD_TEAM_RESERVED_PERCENT:-}
      MAX_RETRY_AFTER: ${MAX_RETRY_AFTER:-}
      AGGREGATOR_MAX_RESPONSE_BYTES: ${AGGREGATOR_MAX_RESPONSE_BYTES:-}
      AUTH_VALIDATE_MAX_BYTES: ${AUTH_VALIDATE_MAX_BYTES:-}
      <<: *http
    ports: ['127.0.0.1:${CLIENT_API_PORT:-8080}:8080']
    networks: [auth-api, internal-api, events]
    depends_on:
      auth: {condition: service_healthy}
      aggregator: {condition: service_healthy}
    restart: unless-stopped

  consumer-a:
    build: ./consumers/consumer-a
    environment:
      AMQP_URL: amqp://atlas:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      CONSUMER_PREFETCH: ${CONSUMER_PREFETCH:-}
      CONSUMER_QUEUE_MAX_LENGTH: ${CONSUMER_QUEUE_MAX_LENGTH:-}
      CONSUMER_QUEUE_MAX_BYTES: ${CONSUMER_QUEUE_MAX_BYTES:-}
      CONSUMER_MESSAGE_TTL: ${CONSUMER_MESSAGE_TTL:-}
      <<: [*http, *broker]
    volumes: [consumer-a-data:/data]
    networks: [events]
    depends_on:
      rabbitmq: {condition: service_healthy}
    restart: unless-stopped

  consumer-b:
    build: ./consumers/consumer-b
    environment:
      AMQP_URL: amqp://atlas:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      CONSUMER_PREFETCH: ${CONSUMER_PREFETCH:-}
      CONSUMER_QUEUE_MAX_LENGTH: ${CONSUMER_QUEUE_MAX_LENGTH:-}
      CONSUMER_QUEUE_MAX_BYTES: ${CONSUMER_QUEUE_MAX_BYTES:-}
      CONSUMER_MESSAGE_TTL: ${CONSUMER_MESSAGE_TTL:-}
      <<: [*http, *broker]
    volumes: [consumer-b-data:/data]
    networks: [events]
    depends_on:
      rabbitmq: {condition: service_healthy}
    restart: unless-stopped

  notifier:
    build: ./consumers/notifier
    environment:
      AMQP_URL: amqp://atlas:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      CONSUMER_PREFETCH: ${CONSUMER_PREFETCH:-}
      <<: [*http, *broker]
    volumes: [notifier-data:/data]
    networks: [events]
    depends_on:
      rabbitmq: {condition: service_healthy}
    restart: unless-stopped

  consumer-c-demo:
    profiles: [consumer-c-demo]
    build: ./consumers/consumer-b
    environment:
      AMQP_URL: amqp://atlas:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      # The consumer-b image defaults to consumer-b, so only the name and queue change.
      CONSUMER_NAME: consumer-c
      CONSUMER_QUEUE: hazard.events.consumer-c
      CONSUMER_PREFETCH: ${CONSUMER_PREFETCH:-}
      CONSUMER_QUEUE_MAX_LENGTH: ${CONSUMER_QUEUE_MAX_LENGTH:-}
      CONSUMER_QUEUE_MAX_BYTES: ${CONSUMER_QUEUE_MAX_BYTES:-}
      CONSUMER_MESSAGE_TTL: ${CONSUMER_MESSAGE_TTL:-}
      <<: [*http, *broker]
    volumes: [consumer-c-data:/data]
    networks: [events]
    depends_on:
      rabbitmq: {condition: service_healthy}
    restart: unless-stopped

networks:
  sources:
  internal-api:
    internal: true
  auth-api:
  events:
  canonical:
    internal: true
  auth-store:
    internal: true
  bmkg-store:
    internal: true
  pvmbg-store:
    internal: true

configs:
  source-schema-policy:
    file: ./deploy/k8s/base/policy.json

volumes:
  postgres-data:
  bmkg-data:
  pvmbg-data:
  rabbitmq-data:
  consumer-a-data:
  consumer-b-data:
  consumer-c-data:
  notifier-data:
