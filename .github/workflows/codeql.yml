name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
          cache-dependency-path: '**/go.sum'
      - uses: github/codeql-action/init@v4
        with:
          languages: go
          # The repo has one go.mod per service, and make build compiles all of them.
          build-mode: manual
      - run: make build
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:go
