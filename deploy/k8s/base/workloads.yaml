    {
      "apiVersion": "apps/v1",
      "kind": "StatefulSet",
      "metadata": {
        "name": "auth-db"
      },
      "spec": {
        "replicas": 1,
        "selector": {
          "matchLabels": {
            "app": "auth-db"
          }
        },
        "template": {
          "metadata": {
            "labels": {
              "app": "auth-db",
              "role": "store",
              "owner": "auth"
            }
          },
          "spec": {
            "containers": [
              {
                "name": "auth-db",
                "image": "postgres:18.3-alpine@sha256:54451ecb8ab38c24c3ec123f2fd501303a3a1856a5c66e98cecf2460d5e1e9d7",
                "imagePullPolicy": "IfNotPresent",
                "ports": [
                  {
                    "containerPort": 5432,
                    "name": "tcp"
                  }
                ],
                "resources": {
                  "requests": {
                    "memory": "512Mi"
                  },
                  "limits": {
                    "memory": "1Gi"
                  }
                },
                "readinessProbe": {
                  "exec": {
                    "command": [
                      "sh",
                      "-c",
                      "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""
                    ]
                  },
                  "periodSeconds": 3,
                  "timeoutSeconds": 2,
                  "failureThreshold": 2
                },
                "livenessProbe": {
                  "tcpSocket": {
                    "port": 5432
                  },
                  "periodSeconds": 10,
                  "timeoutSeconds": 2,
                  "initialDelaySeconds": 30
                },
                "startupProbe": {
                  "exec": {
                    "command": [
                      "sh",
                      "-c",
                      "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""
                    ]
                  },
                  "periodSeconds": 2,
                  "timeoutSeconds": 2,
                  "failureThreshold": 60
                },
                "envFrom": [
                  {
                    "secretRef": {
                      "name": "auth-db-credentials"
                    }
                  }
                ],
                "volumeMounts": [
                  {
                    "name": "data",
                    "mountPath": "/var/lib/postgresql"
                  }
                ]
              }
            ]
          }
        },
        "serviceName": "auth-db",
        "volumeClaimTemplates": [
          {
            "metadata": {
              "name": "data"
            },
            "spec": {
              "accessModes": [
                "ReadWriteOnce"
              ],
              "resources": {
                "requests": {
                  "storage": "2Gi"
                }
              }
            }
          }
        ]
      }
    },
