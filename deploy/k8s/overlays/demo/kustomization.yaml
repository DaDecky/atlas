{
  "apiVersion": "kustomize.config.k8s.io/v1beta1",
  "kind": "Kustomization",
  "resources": [
    "../../base"
  ],
  "replicas": [
    {
      "name": "aggregator",
      "count": 3
    },
    {
      "name": "auth",
      "count": 2
    },
    {
      "name": "client-api",
      "count": 2
    }
  ],
  "patches": [
    {
      "target": {
        "kind": "Deployment",
        "name": "auth|client-api|bmkg|pvmbg|consumer-a|consumer-b|notifier"
      },
      "patch": "[{\"op\": \"add\", \"path\": \"/spec/template/spec/nodeSelector\", \"value\": {\"kubernetes.io/hostname\": \"atlas-node-a\"}}]"
    },
    {
      "target": {
        "kind": "NetworkPolicy",
        "name": "canonical-store-owner|auth-db-owner|bmkg-db-owner|pvmbg-db-owner"
      },
      "patch": "[{\"op\": \"add\", \"path\": \"/spec/ingress/0/from/-\", \"value\": {\"ipBlock\": {\"cidr\": \"10.0.0.40/32\"}}}, {\"op\": \"add\", \"path\": \"/spec/ingress/0/from/-\", \"value\": {\"ipBlock\": {\"cidr\": \"10.0.0.41/32\"}}}, {\"op\": \"add\", \"path\": \"/spec/ingress/0/from/-\", \"value\": {\"ipBlock\": {\"cidr\": \"10.0.0.42/32\"}}}, {\"op\": \"add\", \"path\": \"/spec/ingress/0/from/-\", \"value\": {\"ipBlock\": {\"cidr\": \"10.42.0.0/32\"}}}, {\"op\": \"add\", \"path\": \"/spec/ingress/0/from/-\", \"value\": {\"ipBlock\": {\"cidr\": \"10.42.0.1/32\"}}}, {\"op\": \"add\", \"path\": \"/spec/ingress/0/from/-\", \"value\": {\"ipBlock\": {\"cidr\": \"10.42.2.0/32\"}}}, {\"op\": \"add\", \"path\": \"/spec/ingress/0/from/-\", \"value\": {\"ipBlock\": {\"cidr\": \"10.42.2.1/32\"}}}, {\"op\": \"add\", \"path\": \"/spec/ingress/0/from/-\", \"value\": {\"ipBlock\": {\"cidr\": \"10.42.4.0/32\"}}}, {\"op\": \"add\", \"path\": \"/spec/ingress/0/from/-\", \"value\": {\"ipBlock\": {\"cidr\": \"10.42.4.1/32\"}}}]"
    },
    {
      "target": {
        "kind": "StatefulSet",
        "name": "auth-db|bmkg-db|pvmbg-db|rabbitmq"
      },
      "patch": "[{\"op\": \"add\", \"path\": \"/spec/template/spec/nodeSelector\", \"value\": {\"kubernetes.io/hostname\": \"atlas-node-a\"}}]"
    },
    {
      "target": {
        "kind": "Deployment",
        "name": "aggregator"
      },
      "patch": "[{\"op\": \"add\", \"path\": \"/spec/template/spec/containers/0/env/-\", \"value\": {\"name\": \"M2_READ_ONLY\", \"value\": \"1\"}}, {\"op\": \"add\", \"path\": \"/spec/template/spec/containers/0/env/-\", \"value\": {\"name\": \"M2_DATA_CONFIG\", \"value\": \"/etc/atlas/data/config.json\"}}, {\"op\": \"add\", \"path\": \"/spec/template/spec/volumes/-\", \"value\": {\"name\": \"data-config\", \"secret\": {\"secretName\": \"canonical-data-config\"}}}, {\"op\": \"add\", \"path\": \"/spec/template/spec/containers/0/volumeMounts/-\", \"value\": {\"name\": \"data-config\", \"mountPath\": \"/etc/atlas/data\", \"readOnly\": true}}]"
    }
  ]
}
