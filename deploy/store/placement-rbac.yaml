apiVersion: v1
kind: ServiceAccount
metadata:
  name: aggregator-data
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aggregator-data
rules:
  - apiGroups: ['']
    resources: [configmaps]
    resourceNames: [canonical-placement]
    # The informer lists and watches with a metadata.name field selector, which RBAC requires for names.
    verbs: [get, list, watch, update]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [aggregator-placement, aggregator-bmkg, aggregator-pvmbg, aggregator-satelit, aggregator-sensor-pantai]
    verbs: [get, update]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aggregator-data
subjects:
  - kind: ServiceAccount
    name: aggregator-data
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aggregator-data
