<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atlas · Analitik bencana</title>
<style>body{font:16px system-ui;background:#101923;color:#e7edf5;max-width:1100px;margin:auto;padding:30px}header,form{display:flex;gap:12px;align-items:center;flex-wrap:wrap}input,button{font:inherit;padding:9px;background:#1b2b3b;color:inherit;border:1px solid #405164;border-radius:5px}section{background:#172432;padding:20px;margin:20px 0;border-radius:10px}svg{width:100%;height:auto}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:8px;border-bottom:1px solid #405164}.warning{color:#ffbf69}.legend{display:flex;gap:20px;flex-wrap:wrap}h1{margin-right:auto}</style>
<header><h1>Atlas / Analitik</h1><span id="total">— kejadian</span></header>
<form id="filters"><label>Token internal <input id="token" type="password" required autocomplete="off"></label><label>Dari <input id="from" type="date"></label><label>Sampai <input id="to" type="date"></label><button>Muat data</button></form>
<p id="status" role="status">Masukkan token internal untuk memuat analitik.</p>
<section><h2>Kejadian per hari</h2><div class="legend" id="legend"></div><svg id="chart" viewBox="0 0 1000 300" aria-label="Grafik jumlah kejadian menurut jenis bahaya"></svg></section>
<section><h2>Tingkat severity</h2><table><thead><tr><th>Severity</th><th>Kejadian</th></tr></thead><tbody id="severity"></tbody></table></section>
<section><h2>Wilayah</h2><table><thead><tr><th>Wilayah</th><th>Kejadian</th></tr></thead><tbody id="areas"></tbody></table></section>
<script>
const $=id=>document.getElementById(id),colors={SEISMIC:'#7cbaff',TSUNAMI:'#45dfce',VOLCANIC:'#ffad73',WILDFIRE:'#ff6d84',COASTAL:'#c5a0ff'};
function table(id,data){$(id).replaceChildren();for(const [name,count] of Object.entries(data).sort((a,b)=>b[1]-a[1])){let row=document.createElement('tr');for(const v of [name,count]){let cell=document.createElement('td');cell.textContent=v;row.append(cell)}$(id).append(row)}}
function svg(tag,attrs,text){let e=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);if(text!==undefined)e.textContent=text;return e}
function chart(rows){const target=$('chart');target.replaceChildren();$('legend').replaceChildren();const days=[...new Set(rows.map(r=>r.day))].sort(),max=Math.max(1,...rows.map(r=>r.count));target.append(svg('path',{d:'M50 15V260H980',stroke:'#71859b',fill:'none'}));for(const [kind,color]of Object.entries(colors)){let key=document.createElement('span');key.textContent=kind;key.style.color=color;$('legend').append(key);let points=days.map((day,i)=>{const count=rows.find(r=>r.day===day&&r.type===kind)?.count||0;return `${50+i*920/Math.max(1,days.length-1)},${260-count*235/max}`}).join(' ');target.append(svg('polyline',{points,fill:'none',stroke:color,'stroke-width':3}));for(const [i,day]of days.entries()){if(days.length<12||i===0||i===days.length-1)target.append(svg('text',{x:50+i*920/Math.max(1,days.length-1),y:285,fill:'#b8c9db','font-size':12,'text-anchor':i===days.length-1?'end':'start'},day))}}target.append(svg('text',{x:8,y:25,fill:'#b8c9db'},max));if(!rows.length)target.append(svg('text',{x:380,y:130,fill:'#b8c9db'},'Tidak ada data pada rentang ini'))}
$('filters').onsubmit=async e=>{e.preventDefault();$('status').textContent='Memuat…';let query=new URLSearchParams();if($('from').value)query.set('from',$('from').value+'T00:00:00Z');if($('to').value)query.set('to',$('to').value+'T23:59:59Z');try{const response=await fetch('/internal/analytics/summary?'+query,{headers:{Authorization:'Bearer '+$('token').value}});if(!response.ok)throw Error('Gagal memuat data ('+response.status+')');const data=await response.json();$('total').textContent=data.total+' kejadian';$('status').className=data.partial?'warning':'';$('status').textContent=data.partial?'Data belum lengkap. Penyimpanan tidak terjangkau: '+data.unavailable_units.join(', '):'Data lengkap · waktu UTC';table('severity',data.severity);table('areas',data.areas);chart(data.timeline)}catch(error){$('status').textContent=error.message;$('status').className='warning';$('total').textContent='—';table('severity',{});table('areas',{});chart([])}};
</script></html>
